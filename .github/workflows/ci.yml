name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Typecheck i build
    runs-on: ubuntu-latest

    steps:
      - name: Pobierz kod
        uses: actions/checkout@v7

      - name: Ustaw Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Zainstaluj zależności
        run: npm ci

      - name: Sprawdź typy
        run: npm run typecheck

      - name: Testy jednostkowe
        run: npm test

      - name: Testy lokalnego agenta (sync-agent)
        run: node --test
        working-directory: sync-agent

      - name: Zbuduj aplikację
        run: npm run build

      - name: Raport podatności (informacyjnie)
        run: npm audit --audit-level=high || true
